<!doctype html>
<meta charset="utf-8">
<title>xbkmrk — options</title>
<style>
  body {
    margin: 0;
    padding: 1.25rem;
    min-width: 26rem;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  p.hint { font-size: 0.8rem; opacity: 0.7; line-height: 1.4; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.8rem; opacity: 0.85; }
  textarea, input {
    width: 100%;
    box-sizing: border-box;
    background: #1c1c1c;
    color: #eee;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 0.45rem 0.55rem;
    font-family: inherit;
    font-size: 0.85rem;
  }
  textarea { font-family: monospace; font-size: 0.75rem; resize: vertical; }
  button {
    margin-top: 0.9rem;
    background: #2f6feb;
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #status { margin-left: 0.6rem; font-size: 0.8rem; }
</style>
<h1>Save to archive</h1>
<p class="hint">
  The zip downloaded from the archive's Settings page comes pre-configured — you
  normally don't need to change anything here. To repoint the extension, paste a
  fresh bookmarklet code below (address and token are read out of it) or edit
  the fields by hand.
</p>
<label for="paste">Paste bookmarklet code</label>
<textarea id="paste" rows="3" placeholder="javascript:(()=>{…})()"></textarea>
<label for="origin">Archive address</label>
<input id="origin" placeholder="http://your-server:3020">
<label for="token">Save token</label>
<input id="token" placeholder="token">
<button id="save">Save</button><span id="status"></span>
<script src="config.js"></script>
<script src="options.js"></script>
